<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="images/png" href="./images/logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="NeuroInk - Early detection of cognitive changes through AI-powered handwriting analysis"
    />
    <link rel="apple-touch-icon" href="./images/logo.png" />
    <link id="app-manifest" rel="manifest" href="./manifest.json" />
    <script>
      (function() {
        var path = window.location.pathname;
        var link = document.getElementById('app-manifest');
        if (link && path.indexOf('/parkinsons') === 0) {
          link.href = '/manifest-parkinsons.json';
        }
      })();
    </script>
    <title>NeuroInk - AI-Powered Cognitive Assessment</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>  
      if('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/service-worker.js').then(function(registration) {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
            
            // Check for updates every hour
            setInterval(function() {
              registration.update();
            }, 3600000);
            
            // Force update on page load if there's a new service worker waiting
            registration.addEventListener('updatefound', function() {
              const newWorker = registration.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New service worker available, reload to activate
                    console.log('New service worker available, reloading...');
                    window.location.reload();
                  }
                });
              }
            });
          }, function(err) {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
